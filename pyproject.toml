[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hospital-pricing-prediction"
version = "0.1.0"
description = "Leakage-aware hospital cost prediction from admission-time clinical data"
requires-python = ">=3.10"
dependencies = [
  "joblib>=1.3,<2",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<2",
  "streamlit>=1.40,<2",
]

[project.optional-dependencies]
dev = ["jupyterlab>=4,<5", "pytest>=8,<9", "seaborn>=0.13,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
